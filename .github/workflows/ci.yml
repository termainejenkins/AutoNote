name: CI

on:
  pull_request:
  push:
    branches:
      - v1
      - main

permissions:
  contents: read

jobs:
  check:
    name: Manifest and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check extension scripts
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done
          node --check scripts/package-extension.mjs

      - name: Validate manifest and run unit tests
        run: node --test

      - name: Package and validate extension zip
        id: package
        run: node scripts/package-extension.mjs

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          # The script writes dist/<artifact>.zip (manifest at the zip root) and
          # extracts that validated archive to dist/<artifact>/. Actions stores
          # every artifact as a zip, so uploading the files makes the download
          # unzip once to the folder Chrome loads. Uploading the .zip file would
          # nest a second zip inside the download.
          path: ${{ steps.package.outputs.stage }}
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: Extension end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1400x1000x24" npm run test:e2e
