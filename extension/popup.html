<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoNote</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/icon32.png" width="32" height="32" alt="" />
      <h1>AutoNote</h1>
    </header>
    <p id="page-title" class="hint">Checking this page…</p>
    <p id="page-status"></p>
    <p id="progress" class="hint"></p>
    <label for="note-style">Note style</label>
    <select id="note-style">
      <option value="study">Study</option>
      <option value="skim">Skim</option>
    </select>
    <div class="actions">
      <button type="button" id="generate">Generate note</button>
      <button type="button" id="pause-auto" class="secondary">Pause auto for 1 hour</button>
      <button type="button" id="open-notes" class="secondary">My notes</button>
      <button type="button" id="open-options" class="secondary">Options</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
